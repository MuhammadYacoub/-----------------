<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - هيئة قضايا الدولة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --secondary: #b38f00;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 51, 102, 0.15);
            padding: 40px;
            text-align: center;
        }

        .logo {
            width: 80px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            font-size: 22px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .step {
            display: none;
            animation: fadeIn 0.4s;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        .input-box input:focus {
            border-color: var(--primary);
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 18px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary) 0%, #004d99 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-primary:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .alert {
            background: #fef2f2;
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #f0fdf4;
            color: #22c55e;
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
            font-size: 13px;
            color: var(--text-gray);
            text-decoration: none;
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            direction: ltr;
            margin-bottom: 20px;
        }

        .otp-inputs input {
            width: 45px;
            height: 55px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-weight: bold;
            color: var(--primary);
        }

        .otp-inputs input:focus {
            border-color: var(--secondary);
            outline: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/logo.png" alt="Logo" class="logo"
            onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/25/State_Lawsuits_Authority_Logo.png'">
        <h1>إعادة تعيين كلمة المرور</h1>
        <p class="subtitle" id="stepText">أدخل الرقم القومي لإرسال رمز التحقق</p>

        <div id="alertBox" class="alert"><i class="fas fa-exclamation-circle"></i> <span id="alertText"></span></div>

        <!-- Step 1: National ID -->
        <div id="step1" class="step active">
            <form id="nidForm">
                <div class="input-group">
                    <label>الرقم القومي</label>
                    <div class="input-box">
                        <input type="text" id="nationalId" maxlength="14" placeholder="الرقم القومي" required>
                        <i class="fas fa-id-card"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btn1">
                    <span class="btn-text">إرسال رمز التحقق</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Step 2: OTP -->
        <div id="step2" class="step">
            <div class="otp-inputs" id="otpContainer">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
                <input type="text" maxlength="1" inputmode="numeric">
            </div>
            <form id="newPwdForm">
                <div class="input-group">
                    <label>كلمة المرور الجديدة</label>
                    <div class="input-box">
                        <input type="password" id="newPassword" placeholder="6 أحرف على الأقل" required minlength="6">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btn2">
                    <span class="btn-text">تأكيد إعادة التعيين</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Step 3: Success -->
        <div id="step3" class="step" style="text-align: center;">
            <i class="fas fa-check-circle" style="font-size: 60px; color: #22c55e; margin-bottom: 20px;"></i>
            <h2 style="color: var(--primary);">تم بنجاح!</h2>
            <p>تم إعادة تعيين كلمة المرور. يمكنك الآن تسجيل الدخول.</p>
            <a href="login.html" class="btn-primary"
                style="display: inline-block; text-decoration: none; margin-top: 20px; padding: 15px 40px;">الذهاب
                لتسجيل الدخول</a>
        </div>

        <a href="login.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة لتسجيل الدخول</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_URL = '';
        let currentNid = '';

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const alertBox = document.getElementById('alertBox');
        const alertText = document.getElementById('alertText');
        const stepText = document.getElementById('stepText');
        const otpInputs = document.querySelectorAll('.otp-inputs input');

        function showAlert(msg, isSuccess = false) {
            alertText.textContent = msg;
            alertBox.className = 'alert' + (isSuccess ? ' success' : '');
            alertBox.style.display = 'block';
        }

        function setLoading(btn, isLoading) {
            const span = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            if (isLoading) {
                span.style.display = 'none';
                spinner.style.display = 'block';
                btn.disabled = true;
            } else {
                span.style.display = 'block';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }

        // OTP Auto-focus
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Step 1: Send OTP
        document.getElementById('nidForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nid = document.getElementById('nationalId').value.trim();
            if (nid.length !== 14 || isNaN(nid)) {
                showAlert('الرجاء إدخال رقم قومي صحيح');
                return;
            }
            currentNid = nid;
            const btn = document.getElementById('btn1');
            setLoading(btn, true);
            alertBox.style.display = 'none';

            try {
                const res = await axios.post(`${API_URL}/auth/applicant/initiate-login`, { nationalId: nid });
                if (res.data.success) {
                    step1.classList.remove('active');
                    step2.classList.add('active');
                    stepText.textContent = `أدخل الرمز المرسل إلى ${res.data.email}`;
                    otpInputs[0].focus();
                }
            } catch (err) {
                showAlert(err.response?.data?.message || 'حدث خطأ');
            } finally {
                setLoading(btn, false);
            }
        });

        // Step 2: Reset Password
        document.getElementById('newPwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let otp = '';
            otpInputs.forEach(inp => otp += inp.value);
            if (otp.length !== 6) {
                showAlert('الرجاء إدخال الرمز كاملاً');
                return;
            }
            const newPwd = document.getElementById('newPassword').value;
            if (newPwd.length < 6) {
                showAlert('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return;
            }

            const btn = document.getElementById('btn2');
            setLoading(btn, true);
            alertBox.style.display = 'none';

            try {
                const res = await axios.post(`${API_URL}/auth/applicant/reset-password`, {
                    nationalId: currentNid,
                    code: otp,
                    newPassword: newPwd
                });
                if (res.data.success) {
                    step2.classList.remove('active');
                    step3.classList.add('active');
                    stepText.textContent = '';
                }
            } catch (err) {
                showAlert(err.response?.data?.message || 'حدث خطأ');
            } finally {
                setLoading(btn, false);
            }
        });
    </script>
</body>

</html>
